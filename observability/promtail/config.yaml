server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels: {project: aurora-de3, service: nginx, stream: access, __path__: /logs/nginx/access.log}
      - targets: [localhost]
        labels: {project: aurora-de3, service: nginx, stream: error, __path__: /logs/nginx/error.log}
  - job_name: wordpress
    static_configs:
      - targets: [localhost]
        labels: {project: aurora-de3, service: wordpress, stream: events, __path__: /logs/app/events.log}
      - targets: [localhost]
        labels: {project: aurora-de3, service: wordpress, stream: php, __path__: /logs/app/php-error.log}
