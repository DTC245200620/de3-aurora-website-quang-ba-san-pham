log_format aurora escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 20m;
  access_log /var/log/aurora/access.log aurora;
  error_log /var/log/aurora/error.log warn;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  location = /healthz { access_log off; return 200 'ready'; }
  location = /xmlrpc.php { return 403; }
  location ~ /\. { deny all; }
  location / {
    proxy_pass http://wordpress:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server {
  listen 8082;
  server_name _;
  access_log off;
  location = /stub_status { stub_status; }
  location / { return 404; }
}
